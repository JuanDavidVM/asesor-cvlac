# Base de datos en memoria para pruebas (compatible con PostgreSQL)
spring.datasource.url=jdbc:h2:mem:asesor_cvlac_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
