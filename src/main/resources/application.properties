spring.application.name=asesor-cvlac

# PostgreSQL (valores por defecto para desarrollo local; sobrescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/asesor_cvlac}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# El esquema se gestionara con schema.sql (fase de diseno); JPA solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
